# Valida a autenticação OIDC entre o GitHub Actions e a AWS.
#
# Prova três coisas de uma vez:
#   1. o provedor OIDC e a role existem e confiam neste repositório;
#   2. a condição `sub` da trust policy aceita este ref;
#   3. nenhuma credencial de longa duração é necessária.
#
# Roda sob demanda. Depois que os workflows definitivos estiverem no ar,
# este pode ser removido — ele existe para falhar cedo, não para ficar.

name: OIDC smoke test

on:
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # sem isto o GitHub não emite o token OIDC

jobs:
  verificar:
    name: Autenticar na AWS via OIDC
    runs-on: ubuntu-latest
    steps:
      # Diagnóstico: mostra as claims que o GitHub emite, para comparar com a
      # condição `sub` da trust policy. Imprime SÓ as claims públicas — nunca
      # o token em si, que é credencial.
      - name: Claims do token OIDC
        run: |
          TOKEN=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2)
          # base64url -> base64 com padding
          PAYLOAD="${PAYLOAD//-/+}"; PAYLOAD="${PAYLOAD//_//}"
          while [ $(( ${#PAYLOAD} % 4 )) -ne 0 ]; do PAYLOAD="${PAYLOAD}="; done
          echo "$PAYLOAD" | base64 -d 2>/dev/null \
            | jq '{sub, aud, repository, repository_owner, ref, event_name, environment}'

      - name: Assumir a role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Quem sou eu?
        run: aws sts get-caller-identity

      - name: Consigo ler o bucket de state?
        run: aws s3 ls "s3://${{ vars.TF_BUCKET }}" || echo "(bucket vazio — esperado antes do primeiro apply)"

      - name: Resumo
        run: |
          {
            echo "# 🔐 OIDC — autenticação verificada"
            echo
            echo "| Item | Valor |"
            echo "|---|---|"
            echo "| Role assumida | \`${{ vars.AWS_ROLE_ARN }}\` |"
            echo "| Região | \`${{ vars.AWS_REGION }}\` |"
            echo "| Ref | \`${{ github.ref }}\` |"
            echo
            echo "Nenhum secret de credencial AWS foi usado."
          } >> "$GITHUB_STEP_SUMMARY"
